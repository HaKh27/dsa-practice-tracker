<!DOCTYPE html>
<html>
<head>
    <title>Data Structures and Algorithms Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
    <h1>DS&A Tracker</h1>
    <div class="nav-actions">
        <input type="text" id="searchName" name="searchName">
        <button type="button" id="searchByName">Search by Name</button>

        <button type="button" id="reviewButton">See Problems Needing Review</button>

        <button type="button" id ="viewAllButton">View All Problems</button>
    
        <div class="filter-wrapper">
        <button id="filterButton" class="filter-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 4h18l-7 8v6l-4 2v-8z"/>
        </svg>
        </button>
        <div id="filterPanel" class="filter-panel hidden">
        <div class="filter-category">
            <button class="category-toggle">Difficulty</button>
            <div class="category-options hidden">
            <label><input type="checkbox" name="difficulty" value="Easy"> Easy</label>
            <label><input type="checkbox" name="difficulty" value="Medium"> Medium</label>
            <label><input type="checkbox" name="difficulty" value="Hard"> Hard</label>
    </div>
    </div>
    </div>
    </div>
    </div>
    </nav>
    <div class="container">
    
        <form>
            <div class="problem_form">
        <p>Add a new problem: </p>
        <label for ="name">Problem Name: </label>
        <input type="text" id="name" name="name">

        <label for="topic">Topic: </label>
        <input type="text" id="topic" name="topic">

        <label for="difficulty">Difficulty: </label>
        <select id="difficulty" name="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value = "Hard">Hard</option>
        </select>
        
        <button type="submit" id="submit">Add Problem</button>
        </div>
    </form>

    <div class="button_type">
        <input type="text" id="searchTopic" name="searchTopic">
        <button type="button" id="searchByTopic">Search by Topic</button>
    </div>
    
    <table>
        <tr>
            <th>Problem Name</th>
            <th>Topic</th>
            <th>Difficulty</th>
            <th>Last Reviewed</th>
            <th>Action</th>
        </tr>
        
    </table>
    </div>
    <script>
        let activeCancel = null;
        let currentDifficulties=[]
        const button= document.getElementById("submit")
        const nameInput=document.getElementById("name");
        const topicInput= document.getElementById("topic");
        const difficultyInput= document.getElementById("difficulty");
        const reviewButton=document.getElementById("reviewButton")
        const searchTopicBttn= document.getElementById("searchByTopic")
        const searchNameBttn= document.getElementById("searchByName")
        const searchTopicInput=document.getElementById("searchTopic")
        const searchNameInput=document.getElementById("searchName")
        const viewAllButton= document.getElementById("viewAllButton")
        const form=document.querySelector("form")
        const filterButton=document.getElementById("filterButton")

        filterButton.addEventListener("click", function(event){
           document.getElementById("filterPanel")
           .classList.toggle("hidden")
        });

        document.querySelectorAll(".category-toggle").forEach(function(button){
            button.addEventListener("click", function(event){
                this.nextElementSibling.classList.toggle("hidden");
            });
        });

        document.querySelectorAll('input[name="difficulty"]').forEach(checkbox=> 
            checkbox.addEventListener("change", function(event){
                currentDifficulties= Array.from(document.querySelectorAll('input[name="difficulty"]:checked')).map(cb=>
                    cb.value);
                    refreshTable();
            })
            
               // const params= new URLSearchParams();
              // currentDifficulties.forEach(value=> params.append("value",value));

               // fetch(`/filter-difficulty?${params.toString()}`)
                //.then (response=> response.json())
               // .then (data=>loadProblems(data))
        );

        

       

    

        

        viewAllButton.addEventListener("click", function(event){
            event.preventDefault()
            loadProblems();
        })
        
        reviewButton.addEventListener("click", function(event){
            event.preventDefault();
            fetch("/get-needs-review")
            .then(response=> response.json())
            .then(data=> {
                const table= document.querySelector("table")
                table.innerHTML= `<tr>
                    <th>Problem Name</th>
                    <th>Topic</th>
                    <th>Difficulty</th>
                    <th>Last Reviewed</th>
                    <th>Action</th>
                </tr>`

                for (const problem of data) {
                    buildRow(problem,table);
                 
                }
            })

        });

        searchTopicBttn.addEventListener("click", function(event){
            event.preventDefault();
            fetch("/search-by-topic?partial="+searchTopicInput.value)
            .then(response=>response.json())
            .then(data=>{
                const table= document.querySelector("table")
                table.innerHTML= `<tr>
                    <th>Problem Name</th>
                    <th>Topic</th>
                    <th>Difficulty</th>
                    <th>Last Reviewed</th>
                    <th>Action</th>
                </tr>`
                for (const problem of data) {
                    buildRow(problem,table);
                }
            })
        })
        
        searchNameBttn.addEventListener("click", function(event){
            event.preventDefault();
            fetch("/search-by-name?partial="+searchNameInput.value)
            .then(response=>response.json())
            .then(data=>{
                const table=document.querySelector("table")
                table.innerHTML=`<tr>
                    <th>Problem Name</th>
                    <th>Topic</th>
                    <th>Difficulty</th>
                    <th>Last Reviewed</th>
                    <th>Action</th>
                </tr>`
                for (const problem of data) {
                    buildRow(problem,table);
                }
            })
        })

        button.addEventListener("click", function(event){
            event.preventDefault();
            fetch("/add-problem",{
                method: "POST",
                headers:{"Content-Type": "application/json"},
                body: JSON.stringify({name:nameInput.value,topic: topicInput.value, difficulty:difficultyInput.value })


            })
            .then(response => response.json())
            .then(data=>console.log(data))
            .then(loadProblems)
            .then(()=> {nameInput.value="";topicInput.value= ""; difficultyInput.value=""; });
           
        });

        function refreshTable(){
            if  (currentDifficulties.length===0){
                loadProblems();
            } else {
                const params= new URLSearchParams();
                currentDifficulties.forEach(value=> params.append("value",value));

                fetch(`/filter-difficulty?${params.toString()}`)
                .then (response=> response.json())
                .then (data=>renderProblems(data))
            }

        }

        function renderProblems(data){
            const table= document.querySelector("table")
            table.innerHTML = `<tr>
                <th>Problem Name</th>
                <th>Topic</th>
                <th>Difficulty</th>
                <th>Last Reviewed</th>
                <th>Action</th>
            </tr>`;
            for (const problem of data) {
                buildRow(problem,table)
            }
  
        };

        function buildRow(problem,table){

            const newRow= document.createElement("tr")
            const wrapper= document.createElement("span")
            wrapper.textContent= problem.name 

            //name cell
            const pencilBttn3= document.createElement("button");
            pencilBttn3.textContent="✏️";
            pencilBttn3.style.marginLeft = "50px";
            const nameCell=document.createElement("td");

            wrapper.appendChild(pencilBttn3);
            
            wrapper.classList.add("editable-cell");
            nameCell.appendChild(wrapper)
            newRow.appendChild(nameCell);

            //topic cell
            const topicWrapper= document.createElement("span")

            const topicCell= document.createElement("td");
            topicWrapper.textContent=problem.topic;
            //pencil icon

            const pencilBttn= document.createElement("button");
            pencilBttn.textContent="✏️";
            pencilBttn.style.marginLeft = "10px";
            topicWrapper.appendChild(pencilBttn);
            topicCell.appendChild(topicWrapper)
            newRow.appendChild(topicCell);
            topicWrapper.classList.add("editable-cell");

            //difficulty cell
            const difficultyWrapper=document.createElement("span")
            const pencilBttn4= document.createElement("button");
            pencilBttn4.textContent="✏️";
            pencilBttn4.style.marginLeft = "10px";
            const difficultyCell=document.createElement("td");
            difficultyWrapper.textContent=problem.difficulty;
            difficultyWrapper.appendChild(pencilBttn4);
            difficultyCell.appendChild(difficultyWrapper)
            newRow.appendChild(difficultyCell);
            difficultyWrapper.classList.add("editable-cell")

            //last_reviewed cell
            const lrWrapper=document.createElement("span")
            const pencilBttn2= document.createElement("button");
            pencilBttn2.textContent='✏️';
            pencilBttn2.style.marginLeft = "10px";
            const dateCell= document.createElement("td");
            lrWrapper.textContent=problem.last_reviewed;
            lrWrapper.append(pencilBttn2);
            dateCell.appendChild(lrWrapper)


            newRow.appendChild(dateCell);
            lrWrapper.classList.add("editable-cell");


            const actionsCell=document.createElement("td")

            const deleteBttn=document.createElement("button");
            deleteBttn.textContent= "Delete"
            // when clicked, send this problem's id to Flask to delete it, then refresh the table
            deleteBttn.addEventListener("click", function(event){
                event.preventDefault();
                fetch("/delete-problem", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: problem.id })
                })
                .then(response=> response.json())
                .then(data=> {
                    console.log(data)
                    refreshTable(); // refresh the table after a successful delete
            });
            });

            actionsCell.appendChild(deleteBttn)
            
            

            pencilBttn.addEventListener("click", function(event){
                event.preventDefault();
                if (activeCancel) { activeCancel(); }
                topicCell.innerHTML=""; //clear existing content
                const input= document.createElement("input")
                //input.value= ""; //prefill with current value
                topicCell.appendChild(input);

               function cancelTopicEdit() {
                    topicCell.innerHTML = "";
                    topicWrapper.textContent = problem.topic;
                    topicWrapper.appendChild(pencilBttn);
                    topicCell.appendChild(topicWrapper)
                    activeCancel = null;
                }
                activeCancel = cancelTopicEdit;
                
                input.addEventListener("keydown", function(event){
                    if(event.key=="Enter"){
                        if (input.value==""){return;}
                        fetch("/update-field", {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ field: "topic", id: problem.id, value: input.value })
                        
                    })
                    
                    .then(response=>response.json())
                    .then(data=> {
                        console.log(data);
                        refreshTable();

                    });
                    
                  
                }
                })
                

                input.addEventListener("blur", function() {
                    if (activeCancel === cancelTopicEdit) { cancelTopicEdit(); }
                });
            });

            pencilBttn2.addEventListener("click", function(event){
                event.preventDefault();
                if (activeCancel) { activeCancel(); }
                dateCell.innerHTML=""; //clear existing content
                const input= document.createElement("input")
                input.type="date"
                dateCell.appendChild(input);

                function cancelDateEdit() {
                    dateCell.innerHTML = "";
                    lrWrapper.textContent = problem.last_reviewed;
                    lrWrapper.appendChild(pencilBttn2);
                    dateCell.appendChild(lrWrapper)
                    activeCancel = null;
                }
                activeCancel = cancelDateEdit;

                input.addEventListener("keydown", function(event){
                    if(event.key=="Enter"){
                        if(input.value==""){return;}
                        activeCancel=null;
                        fetch("/update-field",{
                            method:"PUT",
                            headers:{"Content-Type":"application/json"},
                            body: JSON.stringify({field:"last_reviewed", id: problem.id, value:input.value})

                        })
                        .then(response=>response.json())
                        .then(data=> {
                            console.log(data)
                            refreshTable();
                        });
                    }
                });
                input.addEventListener("blur", function() {
                    if (activeCancel === cancelDateEdit) { cancelDateEdit(); }
                });
            });

            pencilBttn3.addEventListener("click", function(event){
                event.preventDefault();
                if (activeCancel) { activeCancel(); }
                nameCell.innerHTML="";
                const input=document.createElement("input")
                nameCell.appendChild(input)

                function cancelNameEdit() {
                    
                    nameCell.innerHTML = "";
                    wrapper.textContent = problem.name;
                    wrapper.appendChild(pencilBttn3);
                    nameCell.appendChild(wrapper)
                    activeCancel = null;
                }
                activeCancel = cancelNameEdit;

                input.addEventListener("keydown",function(event){
                    if(event.key=="Enter"){
                        if(input.value==""){return;}
                        activeCancel=null;
                        fetch("/update-field", {
                            method:"PUT",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({field:"name", id:problem.id, value: input.value})
                        })
                        .then(response=>response.json())
                        .then(data=> {
                            console.log(data);
                            refreshTable();
                        });
                    }
                })
                input.addEventListener("blur", function() {
                    if (activeCancel === cancelNameEdit) { cancelNameEdit(); }
                });
            });

            pencilBttn4.addEventListener("click", function(event){
                event.preventDefault();
                if (activeCancel) { activeCancel(); }
                difficultyCell.innerHTML="";

                const select=document.createElement("select");
                const options=["Easy", "Medium", "Hard"];
                for (const opt of options){
                    const optionElement=document.createElement("option");
                    optionElement.value=opt;
                    optionElement.textContent=opt;
                    select.appendChild(optionElement);
                }
                select.value=problem.difficulty
                difficultyCell.appendChild(select);

                function cancelDifficulty() {
                    difficultyCell.innerHTML = "";
                    difficultyWrapper.textContent = problem.difficulty;
                    difficultyWrapper.appendChild(pencilBttn4);
                    difficultyCell.appendChild(difficultyWrapper)
                    activeCancel = null;
                }
                activeCancel = cancelDifficulty;

                select.addEventListener("change", function(event){
                    activeCancel=null;
                    fetch("/update-field",{
                        method:"PUT",
                        headers:{"Content-Type":"application/json"},
                        body: JSON.stringify({field:"difficulty", id:problem.id, value:select.value})
                    })
                    .then(response=>response.json())
                    .then(data=> {
                        console.log(data)
                        refreshTable();
                    });
                })


                select.addEventListener("blur", function() {
                    if (activeCancel === cancelDifficulty) { cancelDifficulty(); }
                });
            })

            
            
            newRow.appendChild(actionsCell)
            table.appendChild(newRow)
        }

        function loadProblems(){
            // fetch all problems from the backend
            fetch("/get-problems")
            .then(response=> response.json())
            .then(data=> {
               renderProblems(data)
            })      
        }

       

        loadProblems()

        
        
    </script>
</body>



</html>
